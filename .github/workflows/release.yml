name: Release to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build, verify and smoke-test wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Trust floor (eMudhra/emSign distrust, pip>=26.2.2 + certifi>=2026.10.19)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -c "import pip._vendor.certifi as c; v=c.__version__; assert tuple(map(int, v.split('.'))) >= (2026, 10, 19), v"
      - run: python -m pip install . build twine
      - run: python -m unittest discover -s tests -v
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import importlib.metadata
          import os
          from repo_contract_check import __version__

          tag = os.environ["TAG_NAME"]
          expected = f"v{__version__}"
          assert tag == expected, f"Tag {tag!r} != expected {expected!r}"
          assert importlib.metadata.version("repo-contract-check") == __version__
          PY
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Clean-venv wheel install and CLI smoke test
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-index --no-deps dist/*.whl
          .wheel-smoke/bin/repo-contract-check --version
          .wheel-smoke/bin/python -I -m repo_contract_check check examples/contracts.json --roots examples/roots.example.json --format json
          rm -rf .wheel-smoke
      - name: Upload verified build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI via OIDC Trusted Publishing
    needs: build-and-verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/repo-contract-check
    permissions:
      id-token: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
