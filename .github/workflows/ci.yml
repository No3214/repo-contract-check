name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Trust floor (eMudhra/emSign distrust, pip>=26.2.2 + certifi>=2026.10.19)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -c "import pip._vendor.certifi as c; v=c.__version__; print('pip vendored certifi', v); assert tuple(map(int, v.split('.'))) >= (2026, 10, 19), v"
      - name: Install package
        run: python -m pip install .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Documented example
        run: python -m repo_contract_check check examples/contracts.json --roots examples/roots.example.json --format json

  package:
    name: Build and isolated wheel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Trust floor (eMudhra/emSign distrust, pip>=26.2.2 + certifi>=2026.10.19)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -c "import pip._vendor.certifi as c; v=c.__version__; print('pip vendored certifi', v); assert tuple(map(int, v.split('.'))) >= (2026, 10, 19), v"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel without dependencies or index access
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --no-index --no-deps dist/*.whl
      - name: Run isolated installed module and console script
        run: |
          .wheel-smoke/bin/python -I -m repo_contract_check check examples/contracts.json --roots examples/roots.example.json --format json
          .wheel-smoke/bin/repo-contract-check --version
